<extend template="base.shtml">
<head id="head"></head>
<main id="main">
  <h1 :text="$page.title"></h1>
  <div :html="$page.content()"></div>
  <ul class="post-list" :loop="$page.subpages()">
    <li class="post">
      <article>
        <a class="title" href="$loop.it.link()">
          <ctx :text="$loop.it.title"></ctx>
        </a>
      </article>
    </li>
  </ul>
</main>
